<section class="produtos-page">
  <div class="page-header">
    <div>
     
      <h2>Produtos</h2>
    </div>
    <span class="badge">{{ produtos.length }} itens</span>
  </div>

  <div class="card form-card">
    <div class="card-title">
      <h3>{{ editandoId !== null ? 'Editar produto' : 'Cadastrar produto' }}</h3>
    </div>

    <div class="form-grid">
      <label class="field">
        <span>Código</span>
        <input type="text" placeholder="Ex: P-001" [(ngModel)]="novoProduto.codigo" />
      </label>

      <label class="field">
        <span>Descrição</span>
        <input type="text" placeholder="Ex: Teclado mecânico" [(ngModel)]="novoProduto.descricao" />
      </label>

      <label class="field">
        <span>Saldo</span>
        <input type="number" min="0" placeholder="0" [(ngModel)]="novoProduto.saldo" />
      </label>
    </div>

    <div class="actions">
      <button type="button" class="primary" (click)="salvar()">
        {{ editandoId !== null ? 'Atualizar' : 'Salvar' }}
      </button>

      <button type="button" class="secondary" *ngIf="editandoId !== null" (click)="cancelarEdicao()">
        Cancelar
      </button>
    </div>

    <p class="erro" *ngIf="erro">{{ erro }}</p>
  </div>

  <div class="card table-card">
    <div class="table-header">
      <h3>Lista de produtos</h3>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Saldo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="carregando">
            <td colspan="4" style="text-align: center; padding: 32px;">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
                <div style="width: 40px; height: 40px; border: 4px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                <span>Carregando produtos...</span>
              </div>
            </td>
          </tr>
          <tr *ngIf="!carregando && produtos.length === 0">
            <td colspan="4" style="text-align: center; padding: 24px;">Nenhum produto cadastrado</td>
          </tr>
          <tr *ngFor="let p of produtos">
            <td>{{ p.codigo }}</td>
            <td>{{ p.descricao }}</td>
            <td>{{ p.saldo }}</td>
            <td>
              <div class="action-group">
                <button type="button" class="ghost" (click)="editar(p)">Editar</button>
                <button type="button" class="danger" (click)="excluir(p.id)">Excluir</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
