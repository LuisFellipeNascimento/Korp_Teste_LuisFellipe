<section class="notas-page">
  <div class="header-row">
    <div>
      <p class="eyebrow">Notas fiscais</p>
      <h2>Notas Cadastradas</h2>
    </div>
    <button class="primary-btn" type="button" (click)="irParaNovaNota()">
      + Criar nota
    </button>
  </div>

  <div class="card">
    <p class="erro" *ngIf="erro">{{ erro }}</p>
    <p class="sucesso" *ngIf="sucesso">{{ sucesso }}</p>

    <div *ngIf="notas.length === 0" class="empty-state">
      Nenhuma nota fiscal cadastrada.
    </div>

    <div *ngIf="notas.length > 0" class="lista-notas">
      <div class="nota-item" *ngFor="let nota of notas">
        <div class="nota-topo">
          <div>
            <strong>Nota nº {{ nota.numero }}</strong>
            <span class="status status-{{ nota.status | lowercase }}">{{ nota.status }}</span>
          </div>
        </div>

        <div class="nota-detalhes" *ngIf="nota.itens?.length">
          <ul>
            <li *ngFor="let item of nota.itens">
              {{ item.codigo }} - {{ item.descricao }} · {{ item.quantidade }} unidade(s)
            </li>
          </ul>
        </div>

        <div class="nota-acao">
          <button
            class="primary-btn"
            type="button"
            (click)="imprimirNota(nota)"
            [disabled]="nota.status !== 'Aberta' || processandoImpressaoId === nota.id"
          >
            {{ processandoImpressaoId === nota.id ? 'Processando...' : 'Imprimir' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
